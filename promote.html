<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promote a Song - MusicApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="upload.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="index.html">&#8592; Back</a>
    <div class="logo">Music<span>App</span></div>
  </header>

  <main class="upload-wrap">
    <section class="upload-card">
      <h1>Promote a <span>song</span></h1>
      <p class="sub">Paste your Audiomack song link and we will promote it.</p>

      <label class="field">Audiomack song link
        <input type="url" id="link" placeholder="https://audiomack.com/artist/song/song-name" autocomplete="off">
      </label>

      <div class="preview" id="preview"></div>
            <div class="drop" id="coverDrop">
        <input type="file" id="coverInput" accept="image/*" hidden>
        <img id="coverPreview" alt="Cover preview">
        <div class="drop-text" id="coverText">
          <span class="drop-icon">&#128444;</span>
          <strong>Add cover art (optional)</strong>
          <small>Save the cover from Audiomack, then choose it here</small>
        </div>
      </div>

      <label class="field">Song title
        <input type="text" id="title" placeholder="e.g. Only One">
      </label>

      <label class="field">Artist name
        <input type="text" id="artist" placeholder="Artist stage name">
      </label>

      <label class="field">Genre
        <select id="genre">
          <option>Afrobeats</option>
          <option>Hip-Hop</option>
          <option>Gospel</option>
          <option>R&amp;B</option>
          <option>Highlife</option>
          <option>Amapiano</option>
          <option>Other</option>
        </select>
      </label>

      <p class="error" id="error"></p>

      <button class="btn btn-green btn-big full" id="submitBtn">Promote Song</button>
    </section>
  </main>

  <!-- Success screen -->
  <div class="success" id="success">
    <div class="success-box">
      <div class="check">&#10003;</div>
      <h2>Song is live!</h2>
      <p id="successText">Your song is now being promoted.</p>
      <a class="btn btn-green" href="index.html">Go to Home</a>
      <button class="btn btn-ghost" id="againBtn">Promote another</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="promote.js"></script>
</body>
</html>
