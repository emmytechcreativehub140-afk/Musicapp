<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist - MusicApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="upload.css">
  <link rel="stylesheet" href="mysongs.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="index.html">&#8592; Home</a>
    <div class="logo">Music<span>App</span></div>
  </header>

  <main class="my-wrap">
    <div class="artist-head">
      <div class="avatar" id="avatar">?</div>
      <h1 id="artistName">Artist</h1>
      <p class="sub">Tap a song to listen.</p>
      <button class="btn btn-ghost" id="shareProfile">Share profile</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="statSongs">0</b><span>Songs</span></div>
      <div class="stat"><b id="statPlays">0</b><span>Total plays</span></div>
      <div class="stat"><b id="statTop">-</b><span>Top song</span></div>
    </div>

    <!-- AD SLOT: paste your ad code inside and remove the ad-label line -->
    <div class="ad-slot"><span class="ad-label">Ad space</span></div>

    <p class="msg" id="msg"></p>
    <div class="my-list" id="songList"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="artist.js"></script>
</body>
</html>
