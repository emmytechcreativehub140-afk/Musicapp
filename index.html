<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicApp - Discover and Promote Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading screen -->
  <div class="loader" id="loader">
    <div class="loader-bars"><span></span><span></span><span></span><span></span></div>
    <p>MusicApp</p>
  </div>

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="logo">Music<span>App</span></div>
    <div class="search-box">
      <input type="text" id="search" placeholder="Search songs or artists">
    </div>
    <div class="top-actions">
            <button class="btn btn-ghost" id="loginBtn">Login</button>
      <button class="btn btn-ghost" id="mySongsBtn">My Songs</button>
      <button class="btn btn-green" id="uploadBtn">Upload</button>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero reveal">
      <div class="hero-glow"></div>
      <h1>Discover and <span>promote</span> new music</h1>
      <p>Upload your songs, get streams, and grow your fanbase.</p>
      <button class="btn btn-green btn-big pulse" id="startBtn">Start Listening</button>
    </section>
    <!-- AD SLOT 1: paste your ad code inside, remove the ad-label line -->
    <div class="ad-slot"><span class="ad-label">Ad space</span></div>
    <!-- Trending -->
    <section class="section reveal">
      <h2>Trending Songs</h2>
      <div class="card-row" id="trendingRow"></div>
    </section>

    <!-- Top artists -->
    <section class="section reveal">
      <h2>Top Artists</h2>
      <div class="artist-row" id="artistRow"></div>
    </section>
        <!-- AD SLOT 2 -->
    <div class="ad-slot"><span class="ad-label">Ad space</span></div>

    <!-- New releases -->
    <section class="section reveal">
      <h2>New Releases</h2>
      <div class="release-list" id="releaseList"></div>
    </section>
  </main>

  <!-- Mini player (tap the song info to open the full player) -->
  <div class="player" id="player">
    <div class="player-info" id="openFull">
      <div class="player-cover" id="playerCover"></div>
      <div>
        <div class="player-title" id="playerTitle">Pick a song</div>
        <div class="player-artist" id="playerArtist">MusicApp</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="ctrl" id="prevBtn">&#9198;</button>
      <button class="ctrl play" id="playBtn">&#9658;</button>
      <button class="ctrl" id="nextBtn">&#9197;</button>
    </div>
    <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- Full player (stage 3) -->
  <div class="full-player" id="fullPlayer">
    <div class="fp-top">
      <button class="fp-close" id="fpClose">&#9660;</button>
      <span>NOW PLAYING</span>
      <span class="fp-spacer"></span>
    </div>

    <div class="fp-cover" id="fpCover">&#9835;</div>

    <div class="fp-details">
      <div class="fp-title" id="fpTitle">Song title</div>
      <div class="fp-artist" id="fpArtist">Artist</div>
      <div class="fp-plays" id="fpPlays"></div>
    </div>

    <div class="fp-progress-wrap">
      <div class="progress fp-bar" id="fpProgress"><div class="progress-fill" id="fpFill"></div></div>
      <div class="fp-times"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
    </div>

    <div class="fp-controls">
      <button class="ctrl" id="shuffleBtn">&#8644;</button>
      <button class="ctrl" id="fpPrev">&#9198;</button>
      <button class="ctrl play" id="fpPlay">&#9658;</button>
      <button class="ctrl" id="fpNext">&#9197;</button>
      <button class="ctrl" id="repeatBtn">&#8635;</button>
    </div>

    <div class="fp-actions">
      <button class="act like-btn" id="fpLike">&#9825;</button>
      <button class="act" id="shareBtn">&#10150; Share</button>
      <button class="act wa" id="waBtn">WhatsApp</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
