<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings - MusicApp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="upload.css">
  <link rel="stylesheet" href="mysongs.css">
</head>
<body>

  <header class="topbar">
    <a class="back" href="index.html">&#8592; Home</a>
    <div class="logo">Music<span>App</span></div>
  </header>

  <main class="upload-wrap">
    <section class="upload-card">
      <h1>Earnings <span>calculator</span></h1>
      <p class="sub">Share the ad money between artists, based on their plays.</p>

      <label class="field">Currency symbol
        <input type="text" id="cur" value="$" maxlength="4">
      </label>
      <label class="field">Ad earnings to share
        <input type="number" id="amount" placeholder="e.g. 100" inputmode="decimal">
      </label>
      <label class="field">Percentage for artists
        <input type="number" id="pct" value="50" inputmode="decimal">
      </label>

      <p class="msg" id="msg"></p>
      <button class="btn btn-green btn-big full" id="calcBtn">Calculate</button>

      <div id="result"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="earnings.js"></script>
</body>
</html>
